# Planner-server-only Nav2 configuration for DREAM's local physical experiment.
# No controller, behavior tree, map server, recovery, or cmd_vel publisher is
# configured here. The costmap is fixed in the same world frame and bounds as
# DREAM's 12 x 12 m free-navigation field; LaserScan ray clearing discovers
# free space while unobserved/occluded cells remain unknown and non-traversable.

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 100000
      max_planning_time: 0.40
      smooth_path: true
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 0.40
      analytic_expansion_ratio: 3.5
      # Five times the 0.4 m minimum radius, as required for safe expansion.
      analytic_expansion_max_length: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 6.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 1.0e-10
        do_refinement: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.20
      rolling_window: false
      origin_x: -6.0
      origin_y: -6.0
      # Humble declares these metre dimensions as integer parameters.
      width: 12
      height: 12
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.16, 0.11], [0.16, -0.11], [-0.16, -0.11], [-0.16, 0.11]]"
      footprint_padding: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        # Ray-cleared cells must replace NO_INFORMATION in this LiDAR-only
        # world-fixed costmap.  Maximum-combination would preserve unknown
        # space and leave only the robot footprint available for goal clicks.
        combination_method: 0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          # These limits belong to the observation source as well as the
          # layer.  Nav2 otherwise defaults this source to a zero-height band
          # and discards the LIMO scan mounted at z ~= 0.18 m.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 5.5
          raytrace_min_range: 0.05
          raytrace_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # This exceeds the 0.264 m circumscribed radius of the measured
        # 0.32 x 0.22 m body after the configured 0.05 m footprint padding.
        # A zero-cost centre is therefore footprint-clear of measured returns.
        inflation_radius: 0.30
        cost_scaling_factor: 5.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true
